[package]
name = "csvdeck"
version = "0.2.0"
edition = "2021"

[dependencies]
eframe = "0.36"
polars = { version = "0.55", default-features = false, features = ["lazy", "csv", "strings", "regex", "temporal", "dtype-date", "dtype-datetime", "fmt", "abs", "parquet", "dtype-struct", "dtype-categorical", "dtype-decimal", "dtype-time", "dtype-duration", "timezones"] }
rfd = "0.17"
regex = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSArray", "NSNotification", "NSOperation", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder"] }
block2 = "0.6"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2
